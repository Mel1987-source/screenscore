name: Build data & deploy

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm test

      - name: Build IMDb data
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node build-imdb-data.mjs data

      - name: Save TMDB id cache
        run: |
          git config user.name "screenscore-bot"
          git config user.email "screenscore-bot@users.noreply.github.com"
          git add data/tmdb-map.json
          git diff --cached --quiet || (git commit -m "Update TMDB id cache" && git push)

      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp *.html *.css *.js *.png *.webmanifest _site/
          rm -f _site/worker-api.js _site/platforms.js
          cp data/imdb-titles.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
